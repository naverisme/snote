services:
  db:
    image: postgres:17.7
    environment:
      POSTGRES_USER: snote
      POSTGRES_PASSWORD: snote_dev_only
      POSTGRES_DB: snote
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snote -d snote"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
