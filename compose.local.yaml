services:
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks: [private]

  api:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: SNOTE <noreply@localhost>
      PUBLIC_BASE_URL: http://localhost:8080
    depends_on:
      mailpit:
        condition: service_started
